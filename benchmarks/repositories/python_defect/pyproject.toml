[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python_defect"
version = "0.1.0"
description = "Synthetic benchmark with intentional source defect for TestPilot AI safety gate verification"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
