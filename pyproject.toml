[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-ai"
version = "0.1.0"
description = "Agentic Software Testing & Validation Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "TestPilot AI Contributors" }]
keywords = ["testing", "ai", "agents", "coverage", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # CLI framework — clean, typed, zero boilerplate
    "typer>=0.12.0",
    # Rich terminal output (pulled in by typer, used for pretty errors/tables)
    "rich>=13.0.0",
    # Data validation & typed configuration
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # YAML config file support
    "pyyaml>=6.0",
    # Environment variable / .env loading
    "python-dotenv>=1.0.0",
    # HTTP client for OpenAI-compatible APIs (OpenAI SDK wraps it; kept here for Ollama direct calls)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# OpenAI provider (optional; can also use Ollama without this)
openai = ["openai>=1.30.0"]

# Development & testing toolchain
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
testpilot = "testpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
